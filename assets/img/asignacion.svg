<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Árbol de ramificación y poda con la mejor asignación resaltada">
  <rect width="800" height="400" fill="#111827"/>
  <!-- Matriz de costes -->
  <g font-family="Consolas, Menlo, monospace" font-size="20" fill="#9ca3af">
    <text x="48" y="118" fill="#6b7280" font-size="15">costes</text>
    <rect x="40" y="134" width="176" height="150" rx="10" fill="#1e2636" stroke="#2b3549"/>
    <text x="66" y="176"><tspan fill="#ffffff" font-weight="700">10</tspan><tspan dx="26">15</tspan><tspan dx="26">20</tspan></text>
    <text x="66" y="216">12<tspan dx="26" fill="#ffffff" font-weight="700">10</tspan><tspan dx="26">18</tspan></text>
    <text x="66" y="256">15<tspan dx="26">18</tspan><tspan dx="26" fill="#ffffff" font-weight="700">12</tspan></text>
    <text x="48" y="318" fill="#b23a48" font-size="17" font-weight="700">óptimo = 32</text>
  </g>
  <!-- Árbol -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M520 70 L380 170" stroke="#b23a48"/>
    <path d="M520 70 L520 170" stroke="#374151"/>
    <path d="M520 70 L660 170" stroke="#374151"/>
    <path d="M380 170 L320 270" stroke="#b23a48"/>
    <path d="M380 170 L440 270" stroke="#374151"/>
    <path d="M320 270 L320 350" stroke="#b23a48"/>
    <path d="M520 170 L500 270" stroke="#374151" stroke-dasharray="6 8"/>
    <path d="M520 170 L580 270" stroke="#374151" stroke-dasharray="6 8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="520" cy="70" r="24" fill="#1e2636" stroke="#b23a48" stroke-width="3"/>
    <text x="520" y="76" fill="#ffffff">0</text>
    <circle cx="380" cy="170" r="24" fill="#b23a48"/>
    <text x="380" y="176" fill="#ffffff">10</text>
    <circle cx="520" cy="170" r="24" fill="#1e2636" stroke="#4b5563" stroke-width="3"/>
    <text x="520" y="176" fill="#9ca3af">15</text>
    <circle cx="660" cy="170" r="24" fill="#1e2636" stroke="#4b5563" stroke-width="3"/>
    <text x="660" y="176" fill="#9ca3af">20</text>
    <circle cx="320" cy="270" r="24" fill="#b23a48"/>
    <text x="320" y="276" fill="#ffffff">20</text>
    <circle cx="440" cy="270" r="24" fill="#1e2636" stroke="#4b5563" stroke-width="3"/>
    <text x="440" y="276" fill="#9ca3af">28</text>
    <circle cx="320" cy="350" r="24" fill="#b23a48"/>
    <text x="320" y="356" fill="#ffffff">32</text>
    <circle cx="500" cy="270" r="20" fill="#111827" stroke="#374151" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="580" cy="270" r="20" fill="#111827" stroke="#374151" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <!-- Poda -->
  <g stroke="#6b7280" stroke-width="3" stroke-linecap="round">
    <path d="M650 214 L670 234 M670 214 L650 234"/>
    <path d="M430 314 L450 334 M450 314 L430 334"/>
  </g>
  <text x="690" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">poda</text>
